version: "3.9"

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: gatekeeper_app
    env_file:
      - .env
    ports:
      - "8501:8501"
    volumes:
      - ../audit_storage:/app/audit_storage
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py", "--mode", "readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
