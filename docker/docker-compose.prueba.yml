# ------------------------------------------------------------------
# Data Gatekeeper — Docker Compose PRUEBA LOCAL
# ------------------------------------------------------------------
# Simula localmente la infraestructura real del banco:
#
#   Servicio real          Simulado por
#   ─────────────────────────────────────────────────────────
#   SingleStore  10.16.190.51:3306    →  contenedor singlestore
#   Hive         10.16.190.21:10000   →  contenedor hive
#   LDAP / AD    austro.grpfin:389    →  contenedor ldap
#   Nginx        (instalado en srv)   →  contenedor nginx :80
#
# Uso:
#   docker compose -f docker/docker-compose.prueba.yml up -d --build
#   docker compose -f docker/docker-compose.prueba.yml logs -f app
#   docker compose -f docker/docker-compose.prueba.yml down
#
# Primera vez (inicializar la BD):
#   docker exec -i gatekeeper_singlestore singlestore \
#     -uroot -pgatekeeper123 < docker/init_db/00_create_db.sql
#   docker exec -i gatekeeper_singlestore singlestore \
#     -uroot -pgatekeeper123 gatekeeper_meta < docker/init_db/01_init.sql
# ------------------------------------------------------------------

version: "3.9"

services:

  singlestore:
    image: ghcr.io/singlestore-labs/singlestoredb-dev:latest
    container_name: gatekeeper_singlestore
    environment:
      ROOT_PASSWORD: "${SS_PASSWORD}"
    ports:
      - "3307:3306"
      - "8080:8080"
    volumes:
      - singlestore_data:/data
      - ./init_db:/init_db
    healthcheck:
      test: ["CMD", "singlestore", "-uroot", "-p${SS_PASSWORD}", "-e", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      gatekeeper_net:
        aliases:
          - singlestore-sim
    restart: unless-stopped

  hive:
    image: apache/hive:4.0.0
    container_name: gatekeeper_hive
    environment:
      SERVICE_NAME: hiveserver2
    ports:
      - "10000:10000"
      - "10002:10002"
      - "9083:9083"
    volumes:
      - hive_warehouse:/opt/hive/data/warehouse
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 10000 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 60s
    networks:
      - gatekeeper_net
    restart: unless-stopped

  ldap:
    image: osixia/openldap:1.5.0
    container_name: gatekeeper_ldap
    environment:
      LDAP_ORGANISATION: "Banco del Austro"
      LDAP_DOMAIN: baustro.fin.ec
      LDAP_ADMIN_PASSWORD: "${LDAP_ADMIN_PASSWORD}"
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "false"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
      - ./ldap:/container/service/slapd/assets/config/bootstrap/ldif/custom
    ports:
      - "389:389"
    networks:
      gatekeeper_net:
        aliases:
          - austro.grpfin
    restart: unless-stopped

  ldap-admin:
    image: osixia/phpldapadmin:0.9.0
    container_name: gatekeeper_ldap_admin
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: ldap
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "8083:80"
    depends_on:
      - ldap
    networks:
      - gatekeeper_net
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: gatekeeper_app
    env_file:
      - .env
    environment:
      SS_HOST: singlestore
      HIVE_HOST: hive
      LDAP_SERVER: ldap://ldap
      LDAP_AUTH_METHOD: SIMPLE
    expose:
      - "8501"
    volumes:
      - ../audit_storage:/app/audit_storage
    depends_on:
      singlestore:
        condition: service_healthy
      hive:
        condition: service_started
      ldap:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py", "--mode", "readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - gatekeeper_net
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    container_name: gatekeeper_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - gatekeeper_net
    restart: unless-stopped

volumes:
  singlestore_data:
  hive_warehouse:
  ldap_data:
  ldap_config:

networks:
  gatekeeper_net:
    driver: bridge
